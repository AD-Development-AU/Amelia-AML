version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # The shipped artefact has no package.json — vendored libs in vendor/
  # are checked manually via VENDOR.md + sbom.cdx.json. If a package.json
  # is added later (e.g. for a tests/ npm setup), add:
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
