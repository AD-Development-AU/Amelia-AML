document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script>
  // Wizard-injected layer: (1) banner showing which step the user came from,
  // (2) CSS overrides so the bundled infographic scales to FULL WIDTH of the
  // viewport (rather than fitting height too — that squashed it).
  //
  // The bundler script below swaps document.documentElement on load, wiping
  // any DOM we add now. JS context (timers, closures) survives though, so we
  // keep re-applying both pieces for 12 seconds — enough to cover the swap
  // and any post-swap cleanup. Idempotent: each piece checks for itself first
  // and skips if already in place.
  (function () {
    var hash = (location.hash || '').replace(/^#/, '');
    var stepNames = {
      start: '1 · Start',
      suitability: '2 · Suitability check',
      practice: '3 · Practice profile',
      governance: '4 · Governance & personnel',
      services: '5 · Designated services',
      clients: '6 · Clients & risk assessment',
      cdd: '7 · CDD, screening & monitoring',
      reporting: '8 · Reporting, records & training',
      dates: '9 · Key dates',
      documents: '10 · Documents',
      templates: '11 · Templates',
      dashboard: '12 · Compliance dashboard'
    };
    var zoneHints = {
      start:       'Orient yourself with the overall journey on the map.',
      suitability: 'See "Step 0 — Scope check" at the top.',
      practice:    'See Phase 1 — Customise (build) — practice profile feeds the whole map.',
      governance:  'See Phase 1 — Customise → Personnel.',
      services:    'See Step 0 — Scope check + Phase 1 — Risk assessment.',
      clients:     'See Phase 1 — Risk assessment / Clients.',
      cdd:         'See Phase 1 — Clients + Phase 2 — Use (the per-client cycle).',
      reporting:   'See Phase 2 — Use and Phase 3 — Maintain & review.',
      dates:       'See the Key statutory dates timeline at the bottom.',
      documents:   'See Phase 1 — Document & approve.',
      templates:   'See Phase 1 — Document & approve.',
      dashboard:   'See Phase 3 — Maintain & review (ongoing program loop).'
    };

    function injectFullWidthCss() {
      if (document.getElementById('wamai-overrides')) return;
      if (!document.head) return;
      var style = document.createElement('style');
      style.id = 'wamai-overrides';
      style.textContent =
        'html, body { height: auto !important; display: block !important; ' +
          'overflow-x: hidden !important; overflow-y: auto !important; ' +
          'background: #f1efe9 !important; }' +
        '.stage { width: 100% !important; height: auto !important; display: block !important; }' +
        '.sheet { ' +
          'transform: scale(var(--wamai-scale, 1)) !important; ' +
          'transform-origin: top center !important; ' +
          'margin: 0 auto !important; ' +
        '}';
      document.head.appendChild(style);
    }

    function recomputeScale() {
      // Sheet design width is 1040px. Scale by viewport width so it fills.
      if (!document.documentElement) return;
      var scale = Math.max(0.1, window.innerWidth / 1040);
      document.documentElement.style.setProperty('--wamai-scale', scale);
      // After scaling, body height needs to be tall enough for the scaled
      // sheet — scale * 2520. Setting via body min-height.
      if (document.body) {
        document.body.style.minHeight = (2520 * scale) + 'px';
      }
    }

    // (banner removed — the parent window now renders a descriptive
    // "Where you are in the wizard" overlay on top of this iframe.)
    function insertBanner() { /* intentionally a no-op */ }

    // -------- ORANGE-CIRCLE LOCATOR --------
    // The wizard's 12 steps don't 1:1 map to the infographic's structure.
    // This lookup picks the best-interpretation zone for each step.
    function findCardByTitle(title) {
      var titles = document.querySelectorAll('.btitle');
      for (var i = 0; i < titles.length; i++) {
        if (titles[i].textContent && titles[i].textContent.indexOf(title) !== -1) {
          return titles[i].closest('.pcard');
        }
      }
      return null;
    }
    function findItemContaining(text) {
      var items = document.querySelectorAll('.pcard .steps li, .cyc-legend .ci');
      var needle = text.toLowerCase();
      for (var i = 0; i < items.length; i++) {
        if (items[i].textContent && items[i].textContent.toLowerCase().indexOf(needle) !== -1) {
          return items[i];
        }
      }
      return null;
    }
    // Returns ARRAY of targets — some steps map to multiple zones.
    // null/undefined entries are filtered out at render time.
    function findTargets(h) {
      switch (h) {
        case 'start':       return [document.querySelector('.scope')];
        case 'suitability': return [document.querySelector('.outcome.inscope') || document.querySelector('.scope')];
        case 'practice':    return [findCardByTitle('Customise')];
        case 'governance':  return [findItemContaining('Personnel')];
        case 'services':    return [document.querySelector('.services')];
        // Step 6 — highlight BOTH Risk assessment AND Clients items under Phase 1
        case 'clients':     return [findItemContaining('Risk assessment'), findItemContaining('Clients')];
        case 'cdd':         return [document.querySelector('.cycle')];
        case 'reporting':   return [document.querySelector('.feedback')];
        case 'dates':       return [document.querySelector('.dates')];
        case 'documents':
        case 'templates':   return [findItemContaining('Document & approve') || findItemContaining('Document')];
        // Step 12 dashboard → Phase 2 "Use" card (the live operating phase)
        case 'dashboard':   return [findCardByTitle('Use')];
        default:            return [];
      }
    }

    function ensureMarkerKeyframes() {
      if (document.getElementById('wamai-marker-keyframes')) return;
      if (!document.head) return;
      var kf = document.createElement('style');
      kf.id = 'wamai-marker-keyframes';
      kf.textContent = '@keyframes wamai-marker-pulse {' +
        '0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 3px rgba(234,88,12,0.18), 0 8px 28px rgba(234,88,12,0.28); }' +
        '50% { transform: scale(1.035); opacity: 0.92; box-shadow: 0 0 0 6px rgba(234,88,12,0.12), 0 10px 32px rgba(234,88,12,0.32); }' +
      '}';
      document.head.appendChild(kf);
    }

    function placeMarker() {
      if (!hash) return;
      if (!document.body) return;
      var targets = findTargets(hash).filter(Boolean);
      if (targets.length === 0) return;
      ensureMarkerKeyframes();

      // Remove any stale markers (e.g. from a previous render) whose parent
      // isn't the current body, or whose index is past the current count.
      var existing = document.querySelectorAll('.wamai-marker');
      existing.forEach(function (el, idx) {
        if (el.parentNode !== document.body) {
          if (el.parentNode) el.parentNode.removeChild(el);
        }
      });

      // Place / update one marker per target.
      targets.forEach(function (target, idx) {
        var rect = target.getBoundingClientRect();
        if (rect.width === 0 && rect.height === 0) return; // not laid out yet
        var id = 'wamai-marker-' + idx;
        var marker = document.getElementById(id);
        if (!marker || marker.parentNode !== document.body) {
          if (marker && marker.parentNode) marker.parentNode.removeChild(marker);
          marker = document.createElement('div');
          marker.id = id;
          marker.className = 'wamai-marker';
          document.body.appendChild(marker);
        }
        // Size — comfortable padding around the target.
        var pad = 14;
        var diameter = Math.max(rect.width, rect.height) + pad * 2;
        diameter = Math.max(86, Math.min(560, diameter));
        // position:fixed pins to viewport — recompute on scroll/resize so the
        // marker tracks the underlying zone reliably.
        var leftPx = Math.round(rect.left + rect.width / 2 - diameter / 2);
        var topPx  = Math.round(rect.top  + rect.height / 2 - diameter / 2);
        marker.style.cssText =
          'position:fixed;' +
          'left:' + leftPx + 'px;' +
          'top:' + topPx + 'px;' +
          'width:' + diameter + 'px;' +
          'height:' + diameter + 'px;' +
          'border:7px solid #ff5a1f;' +
          'border-radius:50%;' +
          'background:rgba(255,90,31,0.08);' +
          'box-shadow:0 0 0 4px rgba(255,90,31,0.25), 0 0 0 9px rgba(255,90,31,0.10), 0 12px 36px rgba(255,90,31,0.35);' +
          'animation:wamai-marker-pulse 1.8s ease-in-out infinite;' +
          'pointer-events:none;' +
          'z-index:99998;' +
          'transition:left .18s ease, top .18s ease, width .18s ease, height .18s ease;';
      });
    }

    var _markerScrolledOnce = false;
    function scrollToMarkerOnce() {
      if (_markerScrolledOnce) return;
      if (!hash) return;
      var targets = findTargets(hash).filter(Boolean);
      if (targets.length === 0) return;
      var first = targets[0];
      var rect = first.getBoundingClientRect();
      if (rect.width === 0 && rect.height === 0) return;
      // Use instant scroll — smooth can be cancelled mid-flight by the
      // bundler's late style changes, leaving the marker offscreen.
      try { first.scrollIntoView({ behavior: 'auto', block: 'center' }); }
      catch (e) { first.scrollIntoView(); }
      _markerScrolledOnce = true;
    }

    window.addEventListener('resize', function () {
      recomputeScale();
      requestAnimationFrame(function () {
        if (hash) placeMarker();
      });
    });
    // Re-position on scroll too — `position:absolute` is fine for vertical
    // scroll but if the page reflows the marker should follow.
    window.addEventListener('scroll', function () {
      if (hash) placeMarker();
    }, { passive: true });

    // Keep re-applying for 12 seconds — survives the bundler's swap.
    var start = Date.now();
    function tick() {
      injectFullWidthCss();
      recomputeScale();
      insertBanner();
      if (hash) {
        placeMarker();
        scrollToMarkerOnce();
      }
      if (Date.now() - start < 12000) setTimeout(tick, 250);
    }
    tick();
  })();
  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>Where am I? — B4 Loud<\u002Ftitle>\n<style>/* ════════════════════════════════════════════════════════════════\n   \"Where am I?\" — warm-white editorial AML/CTF system\n   Tokens · type voices · flair motifs   (shared by all formats)\n   ════════════════════════════════════════════════════════════════ */\n\n\n\n:root {\n  /* ── Warm-white foundation ── */\n  --paper:        #f1efe9;   /* canvas */\n  --panel:        #ffffff;   /* pure-white panels */\n  --panel-2:      #f8f6f1;   /* toasted secondary fill */\n\n  /* ── Hairline structure ── */\n  --line-soft:    #e7e3da;\n  --line-hard:    #cec9bd;\n\n  /* ── Warm ink ── */\n  --ink:          #211d17;\n  --ink-soft:     #6f665a;\n  --ink-faint:    #9b9286;\n\n  /* ── Muted jewel pair (washes, not fills) ── */\n  --teal:         rgb(20,112,138);\n  --berry:        rgb(176,58,90);\n  --teal-12:      rgba(20,112,138,.12);\n  --teal-09:      rgba(20,112,138,.09);\n  --teal-06:      rgba(20,112,138,.06);\n  --berry-12:     rgba(176,58,90,.12);\n  --berry-09:     rgba(176,58,90,.09);\n  --berry-06:     rgba(176,58,90,.06);\n\n  /* ── Type voices ── */\n  --display: 'Instrument Serif', 'Spectral', Georgia, serif;\n  --text:    'Spectral', Georgia, 'Times New Roman', serif;\n  --mono:    'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;\n}\n\n* { box-sizing: border-box; }\n\n/* ── Display / headings: Instrument Serif, optically bolded ── */\n.disp {\n  font-family: var(--display);\n  font-weight: 400;\n  letter-spacing: .005em;\n  color: var(--ink);\n  -webkit-text-stroke: .45px currentColor;\n  text-rendering: optimizeLegibility;\n}\n.disp-light { -webkit-text-stroke: .2px currentColor; }\n\n/* ── Labels: Spectral small-caps, wide tracking ── */\n.label {\n  font-family: var(--text);\n  font-weight: 500;\n  text-transform: uppercase;\n  font-feature-settings: \"smcp\" 1, \"c2sc\" 1;\n  letter-spacing: .18em;\n  color: var(--ink-soft);\n  font-size: 11px;\n  line-height: 1.4;\n}\n.label-teal  { color: var(--teal); }\n.label-berry { color: var(--berry); }\n\n/* ── Data: IBM Plex Mono ── */\n.data {\n  font-family: var(--mono);\n  font-weight: 400;\n  letter-spacing: -.01em;\n  font-variant-numeric: tabular-nums;\n}\n\n/* ── Body prose: Spectral regular ── */\n.prose {\n  font-family: var(--text);\n  font-weight: 400;\n  color: var(--ink-soft);\n  line-height: 1.5;\n  text-wrap: pretty;\n}\n\n/* ════════════════════════════════════════════════════════════════\n   FLAIR — bold flat shapes, rationed\n   ════════════════════════════════════════════════════════════════ */\n\n/* Brand glyph: a circle + a cut-corner blob, overlapping */\n.glyph { position: relative; display: inline-block; }\n.glyph .g-circle {\n  position: absolute; border-radius: 50%;\n  background: var(--teal); opacity: .9;\n}\n.glyph .g-blob {\n  position: absolute;\n  background: var(--berry); opacity: .82;\n  clip-path: polygon(0 0, 100% 0, 100% 64%, 64% 100%, 0 100%);\n}\n\n/* Rotated-diamond bullet */\n.diamond {\n  display: inline-block;\n  width: 7px; height: 7px;\n  background: var(--teal);\n  transform: rotate(45deg);\n}\n\n/* Numeral medallion (serif index inside a tinted disc) */\n.medallion {\n  display: inline-flex; align-items: center; justify-content: center;\n  border-radius: 50%;\n  background: var(--teal-12);\n  color: var(--teal);\n  font-family: var(--display);\n  -webkit-text-stroke: .3px currentColor;\n}\n\n/* Segmented progress meter */\n.meter { display: flex; gap: 4px; }\n.meter .seg {\n  height: 6px; flex: 1; border-radius: 2px;\n  background: var(--line-soft);\n}\n.meter .seg.on { background: var(--teal); }\n\n/* Tinted chip */\n.chip {\n  display: inline-flex; align-items: center; gap: 7px;\n  padding: 5px 11px;\n  border-radius: 999px;\n  background: var(--teal-09);\n  border: 1px solid var(--teal-12);\n  font-family: var(--mono);\n  font-size: 11px;\n  color: var(--teal);\n  letter-spacing: -.01em;\n}\n.chip.berry { background: var(--berry-09); border-color: var(--berry-12); color: var(--berry); }\n\n/* Hairline panel */\n.panel {\n  background: var(--panel);\n  border: 1px solid var(--line-soft);\n}\n.panel-2 { background: var(--panel-2); }\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; height: 100%; background: var(--ink); }\n  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }\n  .stage { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }\n\n  .sheet {\n    width: 1040px; height: 2520px;\n    background: var(--paper); color: var(--ink);\n    padding: 0 0 0;\n    display: flex; flex-direction: column;\n    transform-origin: center center; position: relative; overflow: hidden;\n  }\n\n  /* full-bleed teal masthead */\n  .masthead { background: var(--teal); color: #fff; padding: 56px 64px 50px; position: relative; overflow: hidden; flex: 0 0 auto; }\n  .masthead .m-circle { position: absolute; width: 360px; height: 360px; border-radius: 50%; background: rgba(255,255,255,.08); right: -90px; top: -120px; }\n  .masthead .m-blob { position: absolute; width: 230px; height: 230px; background: var(--berry); opacity: .9; right: 36px; top: 30px;\n                      clip-path: polygon(0 0, 100% 0, 100% 64%, 64% 100%, 0 100%); }\n  .masthead .m-dia { position: absolute; width: 40px; height: 40px; background: var(--teal); transform: rotate(45deg); right: 118px; top: 150px; }\n  .m-inner { position: relative; z-index: 2; }\n  .kicker { margin: 0 0 8px; color: rgba(255,255,255,.82); }\n  .title { font-size: 96px; line-height: .86; margin: 0; color: #fff; -webkit-text-stroke: .4px #fff; }\n  .subt { font-family: var(--text); font-size: 19px; max-width: 560px; margin: 16px 0 0; color: rgba(255,255,255,.9); line-height: 1.5; }\n\n  .body { padding: 36px 64px 44px; display: flex; flex-direction: column; flex: 1; }\n\n  /* scope */\n  .scope { margin-bottom: 32px; }\n  .scope h3 { font-size: 30px; line-height: 1.1; margin: 10px 0 16px; max-width: 800px; }\n  .scope-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }\n  .outcome { border: 1px solid var(--line-soft); background: var(--panel); border-radius: 14px; padding: 16px 20px 16px 24px; position: relative; }\n  .outcome.inscope { background: var(--teal-12); border-color: var(--teal); }\n  .outcome .o-head { display: flex; align-items: baseline; gap: 12px; }\n  .outcome h4 { margin: 0; font-size: 20px; }\n  .outcome p { margin: 6px 0 0; font-size: 13.5px; }\n  .accent-l { position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 4px; }\n  .accent-l.teal { background: var(--teal); } .accent-l.grey { background: var(--line-hard); }\n  .services { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }\n  .service { font-family: var(--mono); font-size: 11px; color: var(--teal);\n             background: var(--teal-09); border: 1px solid var(--teal-12); border-radius: 6px; padding: 4px 10px; }\n\n  /* bold card stack */\n  .pcard { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 10px rgba(33,29,23,.04); }\n  .bar { background: var(--teal); color: #fff; padding: 16px 26px; display: flex; align-items: center; gap: 22px; }\n  .bar.berry { background: var(--berry); }\n  .bar .num { font-family: var(--display); font-size: 50px; line-height: .8; -webkit-text-stroke: .5px #fff; flex: 0 0 auto; }\n  .bar .bt { display: flex; flex-direction: column; gap: 1px; }\n  .bar .btag { font-family: var(--text); font-feature-settings:\"smcp\" 1,\"c2sc\" 1; text-transform: uppercase; letter-spacing: .16em; font-size: 11px; color: rgba(255,255,255,.85); }\n  .bar .btitle { font-family: var(--display); font-size: 32px; -webkit-text-stroke: .4px #fff; }\n  .bar .bwhen { margin-left: auto; font-family: var(--mono); font-size: 12px; color: rgba(255,255,255,.9); text-align: right; }\n  .bd { padding: 22px 26px; }\n\n  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 34px; }\n  .steps li { display: flex; gap: 13px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); align-items: flex-start; }\n  .steps .sd { flex: 0 0 auto; margin-top: 8px; }\n  .steps .st { font-family: var(--text); font-size: 17px; color: var(--ink); line-height: 1.3; }\n  .steps .st small { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; }\n\n  /* connector */\n  .connector { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 16px 0; }\n  .connector .ln { width: 40px; height: 2px; background: var(--teal-12); }\n  .enrol-pill { display: inline-flex; align-items: center; gap: 14px; background: var(--teal); color: #fff;\n                border-radius: 999px; padding: 13px 26px; }\n  .enrol-pill .ico { display: flex; }\n  .enrol-pill .et { font-family: var(--display); font-size: 22px; color: #fff; -webkit-text-stroke: .3px #fff; }\n  .enrol-pill .ed { font-family: var(--mono); font-size: 12.5px; color: rgba(255,255,255,.92); }\n\n  /* cycle */\n  .cycle { display: grid; grid-template-columns: 286px 1fr; gap: 32px; align-items: center; }\n  .cycle svg { width: 286px; height: auto; display: block; }\n  .cyc-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 24px; }\n  .cyc-legend .ci { display: flex; gap: 12px; align-items: baseline; font-family: var(--text); font-size: 16px; color: var(--ink); line-height: 1.24; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }\n  .cyc-legend .cn { font-family: var(--mono); font-size: 12px; color: var(--teal); flex: 0 0 18px; }\n\n  .ecdd { margin-top: 22px; }\n  .ecdd .triggers { columns: 2; column-gap: 32px; margin: 0; padding: 0; list-style: none; }\n  .ecdd .triggers li { break-inside: avoid; display: flex; gap: 9px; padding: 6px 0; font-family: var(--text); font-size: 14px; color: var(--ink); line-height: 1.32; }\n  .ecdd .triggers li .d { flex: 0 0 auto; margin-top: 7px; }\n\n  .feedback { display: flex; align-items: center; gap: 15px; margin-top: 22px; padding: 18px 24px;\n              background: var(--teal-09); border: 1px solid var(--teal-12); border-radius: 14px; }\n  .feedback svg { flex: 0 0 auto; color: var(--teal); }\n  .feedback .ft { font-family: var(--text); font-size: 16px; color: var(--ink); line-height: 1.45; }\n\n  /* dates band */\n  .dates { margin-top: 24px; background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 14px; padding: 20px 26px 8px; }\n  .dates-axis { position: relative; height: 92px; }\n  .axis-line { position: absolute; left: 8px; right: 8px; top: 30px; height: 3px; background: var(--line-hard); border-radius: 3px; }\n  .tick { position: absolute; top: 0; transform: translateX(-50%); text-align: center; width: 200px; }\n  .tick .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--paper); border: 3px solid var(--teal); margin: 22.5px auto 0; }\n  .tick.key .dot { background: var(--berry); border-color: var(--berry); width: 17px; height: 17px; margin-top: 21px; }\n  .tick .dd { font-family: var(--mono); font-size: 13.5px; color: var(--ink); margin-bottom: 6px; }\n  .tick.key .dd { color: var(--berry); font-weight: 500; }\n  .tick .dl { font-family: var(--text); font-size: 13px; color: var(--ink-soft); margin-top: 9px; line-height: 1.28; }\n  .band { position: absolute; top: 26px; height: 11px; border-radius: 3px; background: var(--teal-12); border: 1px solid var(--teal); }\n\n  .foot { margin-top: auto; padding-top: 22px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }\n  .foot .src { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); }\n  .foot .disc { font-family: var(--text); font-size: 13px; color: var(--ink-faint); font-style: italic; }\n\n  .stack { display: flex; flex-direction: column; }\n\n  /* ── editorial label voice · v2 italic serif kicker ── */\n  .label, .bar .btag {\n    text-transform: none;\n    font-style: italic;\n    font-feature-settings: normal;\n    letter-spacing: .005em;\n    font-weight: 500;\n  }\n  .label { font-size: 15px; }\n  .bar .btag { font-size: 15px; color: rgba(255,255,255,.92); }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"stage\">\n  <div class=\"sheet\" data-screen-label=\"Portrait B4 Loud\">\n\n    <header class=\"masthead\">\n      <span class=\"m-circle\"><\u002Fspan>\n      <span class=\"m-blob\"><\u002Fspan>\n      <span class=\"m-dia\"><\u002Fspan>\n      <div class=\"m-inner\">\n        <p class=\"kicker label\" style=\"color:rgba(255,255,255,.82)\">AUSTRAC · Legal Profession AML/CTF Program<\u002Fp>\n        <h1 class=\"title disp\">Where am I?<\u002Fh1>\n        <p class=\"subt\">A field map of the program — from the scope gate, through the one-off build and everyday client work, to the review loop that keeps it alive.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div class=\"body\">\n\n      <!-- SCOPE -->\n      <section class=\"scope\">\n        <p class=\"label label-teal\">Step 0 — Scope check<\u002Fp>\n        <h3 class=\"disp\">Does your practice provide any of the 9 designated services?<\u002Fh3>\n        <div class=\"scope-grid\">\n          <div class=\"outcome inscope\">\n            <span class=\"accent-l teal\"><\u002Fspan>\n            <div class=\"o-head\"><span class=\"label label-teal\">Yes<\u002Fspan><h4 class=\"disp\">In scope — begin the journey<\u002Fh4><\u002Fdiv>\n            <p class=\"prose\">Enrol with AUSTRAC by <span class=\"data\" style=\"color:var(--teal)\">29 Jul 2026<\u002Fspan> if providing designated services from 1 Jul 2026 — otherwise within 28 days of first service.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"outcome\">\n            <span class=\"accent-l grey\"><\u002Fspan>\n            <div class=\"o-head\"><span class=\"label\">No<\u002Fspan><h4 class=\"disp\">Out of scope — monitor<\u002Fh4><\u002Fdiv>\n            <p class=\"prose\">Put service restrictions in place and watch for scope creep into a designated service.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"services\">\n          <span class=\"service\">real estate<\u002Fspan><span class=\"service\">corporate transactions<\u002Fspan><span class=\"service\">funds &amp; assets<\u002Fspan><span class=\"service\">corporate finance<\u002Fspan><span class=\"service\">shelf companies<\u002Fspan><span class=\"service\">structuring<\u002Fspan><span class=\"service\">key corporate roles<\u002Fspan><span class=\"service\">nominees<\u002Fspan><span class=\"service\">registered office<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- CARD STACK -->\n      <div class=\"stack\">\n\n        <div class=\"pcard\">\n          <div class=\"bar\">\n            <span class=\"num\">01<\u002Fspan>\n            <span class=\"bt\"><span class=\"btag\">Phase 1 · build · one-off<\u002Fspan><span class=\"btitle\">Customise<\u002Fspan><\u002Fspan>\n            <span class=\"bwhen\">finish before<br>1 Jul 2026<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"bd\">\n            <ul class=\"steps\">\n              <li><span class=\"diamond sd\"><\u002Fspan><span class=\"st\">Risk assessment<small>services · clients · countries<\u002Fsmall><\u002Fspan><\u002Fli>\n              <li><span class=\"diamond sd\"><\u002Fspan><span class=\"st\">Personnel<small>roles · PDD · training plan<\u002Fsmall><\u002Fspan><\u002Fli>\n              <li><span class=\"diamond sd\"><\u002Fspan><span class=\"st\">Clients<small>sanctions/PEP · CDD · tipping off<\u002Fsmall><\u002Fspan><\u002Fli>\n              <li><span class=\"diamond sd\"><\u002Fspan><span class=\"st\">Document &amp; approve<small>senior-manager sign-off<\u002Fsmall><\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"connector\">\n          <span class=\"ln\"><\u002Fspan>\n          <span class=\"enrol-pill\">\n            <span class=\"ico\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\"><path d=\"M5 12 H19 M14 7 L19 12 L14 17\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span class=\"et disp\">Enrol with AUSTRAC<\u002Fspan>\n            <span class=\"ed\">by 29 Jul 2026<\u002Fspan>\n          <\u002Fspan>\n          <span class=\"ln\"><\u002Fspan>\n        <\u002Fdiv>\n\n        <div class=\"pcard\">\n          <div class=\"bar\">\n            <span class=\"num\">02<\u002Fspan>\n            <span class=\"bt\"><span class=\"btag\">Phase 2 · operate · business-as-usual<\u002Fspan><span class=\"btitle\">Use<\u002Fspan><\u002Fspan>\n            <span class=\"bwhen\">every client,<br>every service<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"bd\">\n            <div class=\"cycle\">\n              <svg viewBox=\"0 0 280 280\" role=\"img\" aria-label=\"Per-client lifecycle\">\n                <circle cx=\"140\" cy=\"140\" r=\"40\" fill=\"rgb(20,112,138)\" stroke=\"rgb(20,112,138)\" stroke-width=\"1\"><\u002Fcircle>\n                <text x=\"140\" y=\"135\" text-anchor=\"middle\" font-family=\"Spectral, serif\" font-size=\"12\" font-weight=\"600\" letter-spacing=\"2\" fill=\"#fff\">PER<\u002Ftext>\n                <text x=\"140\" y=\"152\" text-anchor=\"middle\" font-family=\"Spectral, serif\" font-size=\"12\" font-weight=\"600\" letter-spacing=\"2\" fill=\"#fff\">CLIENT<\u002Ftext>\n                <defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"rgb(20,112,138)\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n                <g fill=\"none\" stroke=\"rgb(20,112,138)\" stroke-width=\"1.8\" opacity=\".45\">\n                  <path d=\"M 156 44  A 100 100 0 0 1 204 70\" marker-end=\"url(#ah)\"><\u002Fpath>\n                  <path d=\"M 232 95  A 100 100 0 0 1 234 148\" marker-end=\"url(#ah)\"><\u002Fpath>\n                  <path d=\"M 222 178 A 100 100 0 0 1 200 222\" marker-end=\"url(#ah)\"><\u002Fpath>\n                  <path d=\"M 168 232 A 100 100 0 0 1 112 232\" marker-end=\"url(#ah)\"><\u002Fpath>\n                  <path d=\"M 80  223 A 100 100 0 0 1 47  180\" marker-end=\"url(#ah)\"><\u002Fpath>\n                  <path d=\"M 46  146 A 100 100 0 0 1 60  93\" marker-end=\"url(#ah)\"><\u002Fpath>\n                  <path d=\"M 78  70  A 100 100 0 0 1 124 44\" marker-end=\"url(#ah)\"><\u002Fpath>\n                <\u002Fg>\n                <g fill=\"rgb(20,112,138)\">\n                  <circle cx=\"140\" cy=\"40\" r=\"18\"><\u002Fcircle><circle cx=\"218\" cy=\"78\" r=\"18\"><\u002Fcircle><circle cx=\"237\" cy=\"163\" r=\"18\"><\u002Fcircle>\n                  <circle cx=\"184\" cy=\"230\" r=\"18\"><\u002Fcircle><circle cx=\"96\" cy=\"230\" r=\"18\"><\u002Fcircle><circle cx=\"43\" cy=\"163\" r=\"18\"><\u002Fcircle><circle cx=\"62\" cy=\"78\" r=\"18\"><\u002Fcircle>\n                <\u002Fg>\n                <g font-family=\"'IBM Plex Mono', monospace\" font-size=\"14\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"500\">\n                  <text x=\"140\" y=\"45\">1<\u002Ftext><text x=\"218\" y=\"83\">2<\u002Ftext><text x=\"237\" y=\"168\">3<\u002Ftext>\n                  <text x=\"184\" y=\"235\">4<\u002Ftext><text x=\"96\" y=\"235\">5<\u002Ftext><text x=\"43\" y=\"168\">6<\u002Ftext><text x=\"62\" y=\"83\">7<\u002Ftext>\n                <\u002Fg>\n              <\u002Fsvg>\n              <div class=\"cyc-legend\">\n                <span class=\"ci\"><span class=\"cn\">01<\u002Fspan>Collect client information<\u002Fspan>\n                <span class=\"ci\"><span class=\"cn\">02<\u002Fspan>Verify client information<\u002Fspan>\n                <span class=\"ci\"><span class=\"cn\">03<\u002Fspan>Identify &amp; assess triggers<\u002Fspan>\n                <span class=\"ci\"><span class=\"cn\">04<\u002Fspan>Decide how to proceed<\u002Fspan>\n                <span class=\"ci\"><span class=\"cn\">05<\u002Fspan>Start the designated service<\u002Fspan>\n                <span class=\"ci\"><span class=\"cn\">06<\u002Fspan>Ongoing customer due diligence<\u002Fspan>\n                <span class=\"ci\"><span class=\"cn\">07<\u002Fspan>End of matter / relationship<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"connector\"><span class=\"ln\" style=\"width:90px\"><\u002Fspan><\u002Fdiv>\n\n        <div class=\"pcard\">\n          <div class=\"bar berry\">\n            <span class=\"num\">!<\u002Fspan>\n            <span class=\"bt\"><span class=\"btag\">Trigger watch<\u002Fspan><span class=\"btitle\">Enhanced CDD<\u002Fspan><\u002Fspan>\n            <span class=\"bwhen\">fires when any<br>is true<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"bd ecdd\">\n            <ul class=\"triggers\">\n              <li><span class=\"diamond d\" style=\"background:var(--berry);opacity:.6\"><\u002Fspan>Customer is high ML/TF risk<\u002Fli>\n              <li><span class=\"diamond d\" style=\"background:var(--berry);opacity:.6\"><\u002Fspan>An individual is a foreign PEP<\u002Fli>\n              <li><span class=\"diamond d\" style=\"background:var(--berry);opacity:.6\"><\u002Fspan>Person located/formed in a high-risk jurisdiction<\u002Fli>\n              <li><span class=\"diamond d\" style=\"background:var(--berry);opacity:.6\"><\u002Fspan>SMR required &amp; you intend to keep serving them<\u002Fli>\n              <li><span class=\"diamond d\" style=\"background:var(--berry);opacity:.6\"><\u002Fspan>Part of a nested service relationship<\u002Fli>\n              <li><span class=\"diamond d\" style=\"background:var(--berry);opacity:.6\"><\u002Fspan>Unusual, large or complex — no economic/legal purpose<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"connector\"><span class=\"ln\" style=\"width:90px\"><\u002Fspan><\u002Fdiv>\n\n        <div class=\"pcard\">\n          <div class=\"bar\">\n            <span class=\"num\">03<\u002Fspan>\n            <span class=\"bt\"><span class=\"btag\">Phase 3 · review · continuous<\u002Fspan><span class=\"btitle\">Maintain &amp; review<\u002Fspan><\u002Fspan>\n            <span class=\"bwhen\">independent eval<br>≥ every 3 yrs<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"bd\">\n            <ul class=\"steps\">\n              <li><span class=\"diamond sd\"><\u002Fspan><span class=\"st\">Effectiveness checks<small>onboarding · ECDD · SMR · TTR · CBM<\u002Fsmall><\u002Fspan><\u002Fli>\n              <li><span class=\"diamond sd\"><\u002Fspan><span class=\"st\">Periodic effectiveness testing summary<\u002Fspan><\u002Fli>\n              <li><span class=\"diamond sd\"><\u002Fspan><span class=\"st\">Annual report to the governing body<\u002Fspan><\u002Fli>\n              <li><span class=\"diamond sd\"><\u002Fspan><span class=\"st\">Independent evaluation<small>first due 30 Jun 2029 – 30 Jun 2030<\u002Fsmall><\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"feedback\">\n        <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12 a9 9 0 1 1 -3 -6.7\"><\u002Fpath><polyline points=\"21 3 21 9 15 9\"><\u002Fpolyline><\u002Fsvg>\n        <span class=\"ft\"><strong style=\"font-weight:600\">Feedback loop —<\u002Fstrong> material findings from Phase 3, or new AUSTRAC guidance, reopen Phase 1: refresh the risk assessment, re-approve, re-train.<\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- KEY DATES -->\n      <section class=\"dates\">\n        <p class=\"label\" style=\"margin:0 0 6px\">Key statutory dates<\u002Fp>\n        <div class=\"dates-axis\">\n          <div class=\"axis-line\"><\u002Fdiv>\n          <div class=\"band\" style=\"left:72%;right:8px\"><\u002Fdiv>\n          <div class=\"tick\" style=\"left:9%\"><div class=\"dd data\">31 Mar 2026<\u002Fdiv><div class=\"dot\"><\u002Fdiv><div class=\"dl\">Enrolment opens<\u002Fdiv><\u002Fdiv>\n          <div class=\"tick key\" style=\"left:33%\"><div class=\"dd data\">1 Jul 2026<\u002Fdiv><div class=\"dot\"><\u002Fdiv><div class=\"dl\">Commencement — program in place<\u002Fdiv><\u002Fdiv>\n          <div class=\"tick\" style=\"left:58%\"><div class=\"dd data\">30 Mar 2029<\u002Fdiv><div class=\"dot\"><\u002Fdiv><div class=\"dl\">End of transitional CDD <em>(existing)<\u002Fem><\u002Fdiv><\u002Fdiv>\n          <div class=\"tick\" style=\"left:84%\"><div class=\"dd data\">2029 – 2030<\u002Fdiv><div class=\"dot\"><\u002Fdiv><div class=\"dl\">First independent evaluation window<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <footer class=\"foot\">\n        <span class=\"src\">SOURCES · AUSTRAC starter kit · LSSA roadmap · AML/CTF Act 2006 · Transitional Rules 2026<\u002Fspan>\n        <span class=\"disc\">Orientation map, not legal advice.<\u002Fspan>\n      <\u002Ffooter>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<script>\n  function fit(){\n    const p = document.querySelector('.sheet');\n    const s = Math.min(window.innerWidth / 1040, window.innerHeight / 2520);\n    p.style.transform = 'scale(' + s + ')';\n  }\n  window.addEventListener('resize', fit); fit();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
